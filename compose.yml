services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      - ticket-network
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend-dev:
    build:
      context: ./backend/dev
    restart: unless-stopped
    env_file:
      - ./backend/dev/.env
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ticket-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/api/tickets', timeout=5)"
        ]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 15s

  backend-prod:
    build:
      context: ./backend/prod
    restart: unless-stopped
    env_file:
      - ./backend/prod/.env
    ports:
      - "3002:3002"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ticket-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/api/tickets', timeout=5)"
        ]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend-dev:
        condition: service_healthy
      backend-prod:
        condition: service_healthy
    networks:
      - ticket-network

volumes:
  mongodb-data:

networks:
  ticket-network:
    driver: bridge